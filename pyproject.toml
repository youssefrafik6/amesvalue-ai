[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "amesvalue-ai"
version = "1.0.0"
description = "Explainable Real Estate Price Prediction & Analytics"
requires-python = ">=3.11"
authors = [{name = "Youssef Rafik"}]
dependencies = [
  "fastapi>=0.115,<1", "joblib>=1.4,<2", "numpy>=2,<3", "pandas>=2.2,<3",
  "plotly>=6,<7", "pydantic>=2.10,<3", "scikit-learn==1.9.1", "scipy>=1.14,<2",
  "statsmodels>=0.14.4,<0.15", "streamlit>=1.44,<2", "threadpoolctl>=3,<4",
  "uvicorn>=0.34,<1", "xlrd>=2.0.1,<3",
]
[project.optional-dependencies]
boost = ["xgboost>=3,<4"]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
amesvalue-train = "amesvalue.evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py311"
exclude = ["renv"]
