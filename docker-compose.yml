x-app: &app
  build: .
  volumes:
    - ./results:/app/results:ro
  environment:
    AMES_RESULTS: /app/results
services:
  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
  dashboard:
    <<: *app
    ports:
      - "127.0.0.1:8501:8501"
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.headless=true"]
